<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  :root {
    --bg: #eef1f6; --card: #ffffff; --ink: #1b2438; --muted: #5d6679; --line: #d9dfea;
    --field: #f4f6fa; --accent: #2d46c9; --accent-ink: #ffffff; --halo: #dfe5fb;
    --warn-bg: #fff3dd; --warn-ink: #6b3f00; --err-bg: #fdeaea; --err-ink: #8a1f1f; --note-bg: #eef1fb;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10141c; --card: #181e2a; --ink: #e8ecf5; --muted: #9ba5b9; --line: #2b3446;
      --field: #1f2736; --accent: #8ea2ff; --accent-ink: #101733; --halo: #25305a;
      --warn-bg: #3a2b12; --warn-ink: #f4d9a6; --err-bg: #3b1c1c; --err-ink: #f5c6c6; --note-bg: #1f2740;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 16px/1.5 "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif; }
  main { max-width: 520px; margin: 0 auto; padding: 24px 16px 40px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 24px; }
  h1 { font-size: 1.35rem; line-height: 1.3; margin: 0 0 6px; }
  .lead { margin: 0 0 20px; color: var(--muted); }
  label { display: block; font-weight: 600; margin: 14px 0 6px; }
  input { width: 100%; padding: 11px 12px; font: inherit; color: var(--ink); background: var(--field);
          border: 1px solid var(--line); border-radius: 8px; }
  input:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .hint { margin: 6px 0 0; font-size: .875rem; color: var(--muted); }
  button { font: inherit; font-weight: 600; cursor: pointer; border-radius: 8px; padding: 11px 16px; }
  .primary { width: 100%; margin-top: 20px; border: 0; background: var(--accent); color: var(--accent-ink); }
  .primary:disabled { opacity: .6; cursor: progress; }
  .ghost { margin-top: 18px; background: transparent; color: var(--ink); border: 1px solid var(--line); }
  .msg { margin-top: 18px; padding: 12px 14px; border-radius: 8px; }
  .msg.warn { background: var(--warn-bg); color: var(--warn-ink); }
  .msg.err { background: var(--err-bg); color: var(--err-ink); }
  #result { margin-top: 22px; padding-top: 20px; border-top: 1px solid var(--line); }
  .status { font-size: 1.6rem; font-weight: 700; line-height: 1.2; margin: 0; }
  .meta { margin: 6px 0 0; color: var(--muted); font-size: .9rem; }
  .steps { list-style: none; margin: 22px 0 0; padding: 0; }
  .steps li { position: relative; padding: 0 0 18px 34px; color: var(--muted); }
  .steps li:last-child { padding-bottom: 0; }
  .steps li::before { content: ""; position: absolute; left: 8px; top: 20px; bottom: 0; width: 2px; background: var(--line); }
  .steps li:last-child::before { display: none; }
  .dot { position: absolute; left: 0; top: 2px; width: 18px; height: 18px; border-radius: 50%;
         border: 2px solid var(--line); background: var(--card); }
  .steps li.done { color: var(--ink); }
  .steps li.done .dot { background: var(--accent); border-color: var(--accent); }
  .steps li.current { color: var(--ink); font-weight: 700; }
  .steps li.current .dot { border-color: var(--accent); background: var(--card); box-shadow: 0 0 0 4px var(--halo); }
  .note { margin-top: 22px; padding: 14px 16px; border-radius: 10px; background: var(--note-bg); white-space: pre-wrap; overflow-wrap: anywhere; }
  .note strong { display: block; margin-bottom: 4px; }
</style>
</head>
<body>
<main id="app" data-needs-email="<?= needsEmail ?>" data-hc="<?= hcContact ?>">
  <section class="card">
    <h1>CDP application status</h1>
    <p class="lead">Enter your NIP to see where your Career Development Program application stands.</p>
    <form id="form" novalidate autocomplete="off">
      <label for="nip">NIP</label>
      <input id="nip" type="text" maxlength="32" autocapitalize="characters" spellcheck="false" required>
      <div id="emailRow" hidden>
        <label for="email">Work email</label>
        <input id="email" type="email" maxlength="254" spellcheck="false">
        <p class="hint">Use the email address HC has on file for you.</p>
      </div>
      <button id="go" class="primary" type="submit">Check status</button>
    </form>
    <div id="msg" role="status" aria-live="polite" hidden></div>
    <div id="result" aria-live="polite" hidden></div>
  </section>
</main>
<script>
(function () {
  'use strict';
  var app = document.getElementById('app');
  var needsEmail = app.getAttribute('data-needs-email') === 'true';
  var hc = app.getAttribute('data-hc') || 'the Human Capital team';
  var form = document.getElementById('form');
  var nip = document.getElementById('nip');
  var email = document.getElementById('email');
  var go = document.getElementById('go');
  var msg = document.getElementById('msg');
  var result = document.getElementById('result');
  if (needsEmail) document.getElementById('emailRow').hidden = false;

  var TEXT = {
    NOT_FOUND: 'We could not find an application record that matches the details you entered. ' +
               'Check them and try again, or contact ' + hc + ' if you need help.',
    LOCKED: 'Too many unsuccessful attempts. Wait a few minutes and try again, or contact ' + hc + '.',
    ERROR: 'Something went wrong on our side. Try again later or contact ' + hc + '.'
  };

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  }
  function empty(node) { while (node.firstChild) node.removeChild(node.firstChild); }
  function showMessage(text, kind) {
    msg.className = 'msg ' + kind;
    msg.textContent = text;
    msg.hidden = false;
    result.hidden = true;
  }
  function clearAll() { msg.hidden = true; result.hidden = true; empty(result); }
  function setBusy(busy) { go.disabled = busy; go.textContent = busy ? 'Checking…' : 'Check status'; }

  function render(d) {
    empty(result);
    result.appendChild(el('p', 'meta', 'Current status'));
    result.appendChild(el('p', 'status', d.status));
    if (d.updatedAt) result.appendChild(el('p', 'meta', 'Last updated ' + d.updatedAt));

    if (d.steps && d.steps.length) {
      var list = el('ol', 'steps');
      d.steps.forEach(function (name, i) {
        var li = el('li', i < d.stepIndex ? 'done' : (i === d.stepIndex ? 'current' : ''));
        li.appendChild(el('span', 'dot'));
        li.appendChild(document.createTextNode(name));
        if (i === d.stepIndex) li.setAttribute('aria-current', 'step');
        list.appendChild(li);
      });
      result.appendChild(list);
    }

    if (d.note) {
      var box = el('div', 'note');
      box.appendChild(el('strong', '', 'Note from HC'));
      box.appendChild(document.createTextNode(d.note));
      result.appendChild(box);
    } else if (d.noteWithheld) {
      result.appendChild(el('p', 'meta', 'HC notes are not shown here. Contact ' + hc + ' for details.'));
    }

    var clear = el('button', 'ghost', 'Clear this screen');
    clear.type = 'button';
    clear.addEventListener('click', function () {
      clearAll(); nip.value = ''; email.value = ''; nip.focus();
    });
    result.appendChild(clear);
    msg.hidden = true;
    result.hidden = false;
  }

  form.addEventListener('submit', function (ev) {
    ev.preventDefault();
    clearAll();
    var n = nip.value.trim();
    var m = email.value.trim();
    if (!n) { showMessage('Enter your NIP.', 'warn'); nip.focus(); return; }
    if (needsEmail && !m) { showMessage('Enter your work email.', 'warn'); email.focus(); return; }
    setBusy(true);
    google.script.run
      .withSuccessHandler(function (d) {
        setBusy(false);
        if (d && d.ok) { render(d); return; }
        var code = d && d.code ? d.code : 'ERROR';
        showMessage(TEXT[code] || TEXT.ERROR, code === 'NOT_FOUND' ? 'warn' : 'err');
      })
      .withFailureHandler(function () { setBusy(false); showMessage(TEXT.ERROR, 'err'); })
      .getCdpStatus(n, needsEmail ? m : '');
  });
})();
</script>
</body>
</html>
